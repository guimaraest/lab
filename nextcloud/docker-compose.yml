version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: nextcloud-db
    restart: always
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - db_data:/var/lib/mysql
    env_file:
      - ../.env
    environment:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_PASSWORD
      - MYSQL_DATABASE
      - MYSQL_USER

  redis:
    image: redis:alpine
    container_name: nextcloud-redis
    restart: always

  app:
    image: nextcloud:apache
    container_name: nextcloud-app
    restart: always
    ports:
      - 20001:80
    depends_on:
      - db
      - redis
    volumes:
      - nextcloud_data:/var/www/html
    env_file:
      - ../.env
    environment:
      - MYSQL_PASSWORD
      - MYSQL_DATABASE
      - MYSQL_USER
      - MYSQL_HOST=db
      - REDIS_HOST=redis

volumes:
  db_data:
  nextcloud_data:

networks:
  lab-net:
    external: true
