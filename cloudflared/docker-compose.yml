services:
  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    container_name: cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    volumes:
      - ./:/etc/cloudflared
    env_file:
      - ../.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "0.0.0.0:20241", "ready"]
      interval: 15s
      timeout: 10s
      retries: ${HEALTHCHECK_RETRIES}
    networks:
      - lab-net
      - tunnel-net

networks:
  lab-net:
    external: true
  tunnel-net:
    external: true
