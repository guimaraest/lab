services:
  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    container_name: cloudflared
    command: tunnel run
    volumes:
      - ./:/etc/cloudflared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "0.0.0.0:20241", "ready"]
      interval: 15s
      timeout: 10s
      retries: ${HEALTHCHECK_RETRIES}
    networks:
      - lab-net

networks:
  lab-net:
    external: true
