services:
  cea:
    build:
      context: ../..
      dockerfile: lab/cea/Dockerfile
    container_name: lab-cea
    restart: unless-stopped
    init: true
    ports:
      - "0.0.0.0:4173:4173"
    expose:
      - "4173"
    networks:
      - lab-net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: ${HEALTHCHECK_RETRIES:?Set HEALTHCHECK_RETRIES in the root .env}
      start_period: 60s
    security_opt:
      - no-new-privileges:true

networks:
  lab-net:
    external: true
