services:
  gluetun:
    image: qmcgaw/gluetun:latest
    restart: unless-stopped
    init: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: mullvad
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES}
      TZ: ${TZ}
      FIREWALL_INPUT_PORTS: "8080"
    volumes:
      - ./gluetun:/gluetun
    networks:
      - lab-net
      - ext-net
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: ${HEALTHCHECK_RETRIES}
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  yt-dlp-web:
    image: ghcr.io/sjtrny/yt-dlp-web:latest
    restart: unless-stopped
    init: true
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      YTDLP_PORT: "8080"
      YTDLP_DOWNLOAD_DIR: /downloads
      YTDLP_STATE_DIR: /state
      YTDLP_DEFAULT_TIMEZONE: ${TZ}
      YTDLP_MAX_CONCURRENT_DOWNLOADS: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: ${HEALTHCHECK_RETRIES}
      start_period: 60s
    volumes:
      - ${DATA_PATH}/media/incoming/youtube:/downloads
      - ./state:/state
    security_opt:
      - no-new-privileges:true

networks:
  lab-net:
    external: true
  ext-net:
    external: true