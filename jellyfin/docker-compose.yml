services:
  jellyfin-app:
    image: jellyfin/jellyfin:12.2
    restart: unless-stopped
    init: true
    container_name: jellyfin-app

    environment:
      TZ: ${TZ:?Set TZ in the root .env}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8096/health"]
      interval: 30s
      timeout: 10s
      retries: ${HEALTHCHECK_RETRIES:?Set HEALTHCHECK_RETRIES in the root .env}
      start_period: 60s

    volumes:
      - ./config:/config
      - ./cache:/cache
      - ${DATA_PATH:?Set DATA_PATH in the root .env}/media/music:/media/music:ro
      - ${DATA_PATH:?Set DATA_PATH in the root .env}/media/video:/media/video:ro
      - ${DATA_PATH:?Set DATA_PATH in the root .env}/media/movies:/media/movies/:ro
      - ${DATA_PATH:?Set DATA_PATH in the root .env}/media/shows:/media/shows/:ro

    networks:
      - lab-net

    security_opt:
      - no-new-privileges:true

networks:
  lab-net:
    external: true
