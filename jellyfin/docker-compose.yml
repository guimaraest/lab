services:
  jellyfin-app:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    init: true

    environment:
      TZ: ${TZ}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8096/health"]
      interval: 30s
      timeout: 10s
      retries: ${HEALTHCHECK_RETRIES}
      start_period: 60s

    volumes:
      - ./config:/config
      - ./cache:/cache
      - ${DATA_PATH}/media/music:/media/music:ro
      - ${DATA_PATH}/media/video:/media/video:ro
      - ${DATA_PATH}/media/movies:/media/movies/:ro
      - ${DATA_PATH}/media/shows:/media/shows/:ro

    networks:
      - lab-net

    security_opt:
      - no-new-privileges:true

networks:
  lab-net:
    external: true
