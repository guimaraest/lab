services:
  minecraft:
    image: itzg/minecraft-server:java25
    container_name: minecraft
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mc-health"]
      interval: 30s
      timeout: 10s
      retries: ${HEALTHCHECK_RETRIES}
    tty: true
    stdin_open: true
    env_file:
      - ../.env

    environment:
      VERSION: "26.3"

      MODRINTH_PROJECTS: |
        fabric-api
        ferrite-core
        lithium
        krypton
        geyser:beta
        skinrestorer
        essential-commands
        simple-voice-chat:beta
        datapack:players-drop-heads
        mc2discord
        chunky

      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
      MODRINTH_PROJECTS_DEFAULT_VERSION_TYPE: "release"

      EULA: "TRUE"
      TYPE: FABRIC

      MEMORY: 4G

      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD}

      ONLINE_MODE: "true"
      MOTD: |-
        §6§lSERVER DOS CRIA
        §7[ §f1.26.3 §7]

      DIFFICULTY: "normal"
      MAX_PLAYERS: 20

      MODE: survival
      DEFAULT_GAMEMODE: survival

      OPS: "Iron_ore_"

      SEED: "-7067950856181840649"
      VIEW_DISTANCE: "12"
      SIMULATION_DISTANCE: "5"

    volumes:
      - ${DATA_PATH}/minecraft:/data

  playit:
    image: ghcr.io/playit-cloud/playit-agent:0.17
    restart: unless-stopped
    network_mode: service:minecraft
    env_file:
      - ../.env

    depends_on:
      - minecraft
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: ${HEALTHCHECK_RETRIES}
