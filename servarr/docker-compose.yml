# Compose file for the *arr stack. The lab CLI loads the repository .env and
# passes only the variables declared below into each service.

networks:
  servarrnetwork:
    name: servarrnetwork
    ipam:
      config:
        - subnet: 172.39.0.0/24

services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun # If running on an LXC see readme for more info.
    networks:
      servarrnetwork:
        ipv4_address: ${SET_IP_GLUETUN:?Set SET_IP_GLUETUN in the root .env}
    ports:
      - 8080:8080 # qbittorrent web interface
      - 6789:6789 # nzbget
      - 9696:9696 # prowlarr
      - 8191:8191 # flaresolverr
    volumes:
      - ./gluetun:/gluetun
    environment:
      VPN_SERVICE_PROVIDER: mullvad
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?Set WIREGUARD_PRIVATE_KEY in the root .env}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:?Set WIREGUARD_ADDRESSES in the root .env}
      TZ: ${TZ:?Set TZ in the root .env}
    healthcheck:
      test: ["CMD-SHELL", "ping -c 1 www.google.com || exit 1"]
      interval: 20s
      timeout: 10s
      retries: ${HEALTHCHECK_RETRIES:?Set HEALTHCHECK_RETRIES in the root .env}
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    labels:
      - deunhealth.restart.on.unhealthy=true
    environment:
      - PUID=${PUID:?Set PUID in the root .env}
      - PGID=${PGID:?Set PGID in the root .env}
      - TZ=${TZ:?Set TZ in the root .env}
      - WEBUI_PORT=8080 # must match "qbittorrent web interface" port number in gluetun's service above
    volumes:
      - ./qbittorrent:/config
      - ${DATA_PATH:?Set DATA_PATH in the root .env}/media:/data
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    network_mode: service:gluetun
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 60s
      retries: ${HEALTHCHECK_RETRIES:?Set HEALTHCHECK_RETRIES in the root .env}
      start_period: 20s
      timeout: 10s

  # See the 'qBittorrent Stalls with VPN Timeout' section for more information.
  deunhealth:
    image: qmcgaw/deunhealth
    container_name: deunhealth
    network_mode: "none"
    environment:
      - LOG_LEVEL=info
      - HEALTH_SERVER_ADDRESS=127.0.0.1:9999
      - TZ=${TZ:?Set TZ in the root .env}
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  nzbget:
    image: lscr.io/linuxserver/nzbget:latest
    container_name: nzbget
    environment:
      - PUID=${PUID:?Set PUID in the root .env}
      - PGID=${PGID:?Set PGID in the root .env}
      - TZ=${TZ:?Set TZ in the root .env}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:6789/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: ${HEALTHCHECK_RETRIES:?Set HEALTHCHECK_RETRIES in the root .env}
      start_period: 30s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./nzbget:/config
      - ${DATA_PATH:?Set DATA_PATH in the root .env}/media:/data
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    network_mode: service:gluetun

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID:?Set PUID in the root .env}
      - PGID=${PGID:?Set PGID in the root .env}
      - TZ=${TZ:?Set TZ in the root .env}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: ${HEALTHCHECK_RETRIES:?Set HEALTHCHECK_RETRIES in the root .env}
      start_period: 30s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./prowlarr:/config
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    network_mode: service:gluetun

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - TZ=${TZ:?Set TZ in the root .env}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8191/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: ${HEALTHCHECK_RETRIES:?Set HEALTHCHECK_RETRIES in the root .env}
      start_period: 30s
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    network_mode: service:gluetun
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    dns:
      - 1.1.1.1
    environment:
      - PUID=${PUID:?Set PUID in the root .env}
      - PGID=${PGID:?Set PGID in the root .env}
      - TZ=${TZ:?Set TZ in the root .env}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: ${HEALTHCHECK_RETRIES:?Set HEALTHCHECK_RETRIES in the root .env}
      start_period: 30s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./sonarr:/config
      - ${DATA_PATH:?Set DATA_PATH in the root .env}/media:/data
    ports:
      - 8989:8989
    networks:
      servarrnetwork:
        ipv4_address: ${SET_IP_SONARR:?Set SET_IP_SONARR in the root .env}

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    dns:
      - 1.1.1.1
    environment:
      - PUID=${PUID:?Set PUID in the root .env}
      - PGID=${PGID:?Set PGID in the root .env}
      - TZ=${TZ:?Set TZ in the root .env}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: ${HEALTHCHECK_RETRIES:?Set HEALTHCHECK_RETRIES in the root .env}
      start_period: 30s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./radarr:/config
      - ${DATA_PATH:?Set DATA_PATH in the root .env}/media:/data
    ports:
      - 7878:7878
    networks:
      servarrnetwork:
        ipv4_address: ${SET_IP_RADARR:?Set SET_IP_RADARR in the root .env}

  lidarr:
    container_name: lidarr
    image: lscr.io/linuxserver/lidarr:latest
    restart: unless-stopped
    dns:
      - 1.1.1.1
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./lidarr:/config
      - ${DATA_PATH:?Set DATA_PATH in the root .env}/media:/data
    environment:
      - PUID=${PUID:?Set PUID in the root .env}
      - PGID=${PGID:?Set PGID in the root .env}
      - TZ=${TZ:?Set TZ in the root .env}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8686/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: ${HEALTHCHECK_RETRIES:?Set HEALTHCHECK_RETRIES in the root .env}
      start_period: 30s
    ports:
      - 8686:8686
    networks:
      servarrnetwork:
        ipv4_address: ${SET_IP_LIDARR:?Set SET_IP_LIDARR in the root .env}

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    dns:
      - 1.1.1.1
    environment:
      - PUID=${PUID:?Set PUID in the root .env}
      - PGID=${PGID:?Set PGID in the root .env}
      - TZ=${TZ:?Set TZ in the root .env}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./bazarr:/config
      - ${DATA_PATH:?Set DATA_PATH in the root .env}/media:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:6767/api/system/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: ${HEALTHCHECK_RETRIES:?Set HEALTHCHECK_RETRIES in the root .env}
      start_period: 30s
    ports:
      - 6767:6767
    networks:
      servarrnetwork:
        ipv4_address: ${SET_IP_BAZARR:?Set SET_IP_BAZARR in the root .env}

  seerr:
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:latest
    dns:
      - 1.1.1.1
    environment:
      - LOG_LEVEL=debug
      - PUID=${PUID:?Set PUID in the root .env}
      - PGID=${PGID:?Set PGID in the root .env}
      - TZ=${TZ:?Set TZ in the root .env}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: ${HEALTHCHECK_RETRIES:?Set HEALTHCHECK_RETRIES in the root .env}
    restart: unless-stopped
    volumes:
      - ./seerr:/app/config
    ports:
      - 5055:5055
    networks:
      servarrnetwork:
        ipv4_address: ${SET_IP_SEERR:?Set SET_IP_SEERR in the root .env}

