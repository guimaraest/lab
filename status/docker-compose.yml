services:
  status:
    build:
      context: .
    container_name: lab-status
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    expose:
      - "8080"
    volumes:
      - ..:/source:ro
      - ${DATA_PATH:?Set DATA_PATH in the root .env}:${DATA_PATH:?Set DATA_PATH in the root .env}:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - status_cache:/var/cache/status
    networks:
      - lab-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: ${HEALTHCHECK_RETRIES:?Set HEALTHCHECK_RETRIES in the root .env}

volumes:
  status_cache:

networks:
  lab-net:
    external: true
